<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Event</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("https://i.pinimg.com/736x/9c/13/6d/9c136dca5096e8359e8fbdb9893f5f26.jpg") no-repeat center center/cover;
            backdrop-filter: blur(6px);
            font-family: Arial, sans-serif;
            color: rgb(0, 0, 0);

        }

        .box {
            border: rgba(27, 68, 5, 0.993) solid 3px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-radius: 15px;
            width: 400px;
        }

        .box h1 {
            font-size: 40px;
            font-family: Georgia, 'Times New Roman', Times, serif;

        }

        .box label {
            font-size: 22px;
            padding: 10px;
        }

        .box input {
            padding: 10px;
            border-radius: 10px;
            border: none;

        }

        .box button {

            width: 50%;
            padding: 10px;
            margin: 20px auto;
            border-radius: 10px;
            text-align: center;
            justify-content: center;
            font-size: 20px;
        }

        .box button:hover {
            background-color: rgb(111, 249, 111);
        }
    </style>
</head>

<body>

    <form action="" id="myForm" class="box">
        <center>
            <h1>Forms</h1>
        </center>
        <label for="">Name</label>
        <input type="text" id="name" placeholder="Enter your Name">
        <label for="">Age</label>
        <input type="number" id="age" placeholder="Enter your Age">
        <label for="">Email ID</label>
        <input type="email" id="email" placeholder=" Enter your Email Id">
        <label for="">Phone</label>
        <input type="number" id="phone" placeholder=" Enter your Phone Number">
        <button type="submit">Submit</button>

    </form>

    <script src="/Form data.js"></script>
</body>

</html>
