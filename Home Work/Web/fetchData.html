
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Form</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#74b9ff,#a29bfe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
}

.form-container{
    background:white;
    padding:30px;
    width:320px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
}

input:focus{
    border-color:#6c5ce7;
}

button{
    width:100%;
    margin-top:20px;
    padding:10px;
    border:none;
    background:#6c5ce7;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#4834d4;
}

</style>
</head>

<body>

<div class="form-container">

<h2>User Form</h2>

<form>

<label>ID</label>
<input type="number" id="id" required>

<label>Name</label>
<input type="text" id="name">

<label>Username</label>
<input type="text" id="username">

<label>Email</label>
<input type="email" id="email">

<button type="button" onclick="fetchData()">Submit</button>

</form>

</div>
<script src="AsyncAwait.js"></script>
</body>
</html>
