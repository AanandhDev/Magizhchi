<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
    <style>
        body {
            background-image: url(https://img.freepik.com/free-vector/glowing-musical-pentagram-background-with-sound-notes_1017-31220.jpg?semt=ais_user_personalization&w=740&q=80);
            background-size: cover;
            background-repeat: no-repeat;

        }

        h1 {
            margin-top: 80px;
            margin-bottom: 80px;
            color:rgb(255, 255, 255);
            
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 50px;
        }

        button {
            background-color: rgb(0, 247, 255);
            color: rgb(0, 0, 0);
            padding: 10px 50px;
            margin: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 500;
            width: 250px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
           transition: transform 0.3s ;
        }
        
        button:hover {
             transform: scale(1.08);
           border: rgb(0, 247, 255) 3px solid;
           /* box-shadow:  rgb(0, 247, 255) 0px 0px 5px 2px; */
        }
        a {
            text-decoration: none;
        }
    </style>
</head>

<body>
    <center>
        <div>
            <h1>MEDIA PLAYER APPLICATION</h1>
            <a href="/Spotify.html"><button>Play Audio</button></a>
            <a href="Video.html"><button>Play Video</button></a>
            <a href="#"><button>Display Subtittle</button></a>
            <a href="#"><button>Exit</button></a>
            
        </div>
    </center>
</body>

</html>
