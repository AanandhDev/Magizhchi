<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Climate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }

        h1 {
            font-size: 40px;
        }

        h3 {
            font-size: 24px;
        }

        ul {
            font-size: 18px;
        }
        .box{
            border: 2px black solid;
            padding: 0px 50px;
            width: 30%;
            position: absolute;
            left: 35%;
            border-radius: 2%;
            
        }
    </style>
</head>

<body>

    <div class="box">
        <center><h1>City Climate Information</h1></center>
        <h3>Chennai</h3>
        <ul>
            <li><b>Temperature:</b> 34°C</li>
            <li><b>Climate:</b> Hot & Humid </li>
            <li><b>Rainfall:</b> 70%</li>
        </ul>

        <h3>Delhi</h3>
        <ul>
            <li><b>Temperature:</b>30°C</li>
            <li><b>Climate:</b> Dry</li>
            <li><b>Rainfall:</b> 40%</li>
        </ul>

        <h3>Chennai</h3>
        <ul>
            <li><b>Temperature:</b> 32°C</li>
            <li><b>Climate:</b> Humid </li>
            <li><b>Rainfall:</b> 75%</li>
        </ul>

    </div>
  
</body>

</html>
